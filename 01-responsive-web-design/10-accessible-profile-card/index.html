<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accessible Profile Card project">
    <link rel="stylesheet" href="styles.css">
    <title>Accessible Profile Card</title>
</head>
    <body>
        <article class="card" aria-label="Profile card: Neon Ronin">
            <header class="card-header">
                <img src="image/neon-ronin.png" alt="Portrait of Neon Ronin, a cyberpunk accessibility guardian" class="card-img" width="300" height="300">
                <h2 class="card-name">Neon Ronin</h2>
                <p class="card-role">Accessibility Guardian</p>
            </header>

            <section class="card-body">
                <p class="card-bio">Once an electrician, now a digital wanderer ensuring every interface shines with inclusion and clarity.</p>
            </section>

            <footer class="card-footer">
                <ul class="card-social-links">
                    <li><a href="mailto:ronin@example.com" class="card-link" aria-label="Contact Neon Ronin">Contact</a></li>
                    <li><a href="https://example.com" class="card-link" aria-label="View Neon Ronin's portfolio">Portfolio</a></li>
                </ul>
            </footer>
        </article>
    </body>
</html>
