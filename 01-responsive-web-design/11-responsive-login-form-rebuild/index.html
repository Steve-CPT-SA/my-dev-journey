<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign-in Form project">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <title>Login Form</title>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>

        <form action="/signin" method="post">
            <fieldset>

                <legend>Login</legend>

                <div class="login-card">
                    <!-- Identifier field -->
                    <div class="form-field form-email">
                        <input id="user-sign" name="user" type="text" required
                                placeholder="Email or Phone number"
                                autocomplete="username" autofocus
                                aria-describedby="user-error">
                        <label for="user-sign">Email or phone number</label>
                        <span id="user-error" class="error-message" hidden>Enter a valid email or phone number</span>
                    </div>

                    <!-- Password field -->
                    <div class="form-field form-password">
                        <input type="password" name="user-password" id="password" required
                                placeholder="Password"
                                autocomplete="current-password"
                                aria-describedby="password-error">
                        <label for="password" class="label-hidden">Password</label>
                        <span id="password-error" class="error-message" hidden>Password must not be empty</span>
                    </div>
                
                    <!-- Help options -->
                    <div class="form-help">
                        <div class="remember-me">
                            <input type="checkbox" id="checkbox" name="remember">  
                            <label for="checkbox">Remember me</label>    
                        </div>
                        <a href="#">Need help?</a>
                    </div>

                    <!-- Submit button -->
                    <div class="button">
                        <button type="submit" id="btn-sign-in" name="sign-in" value="true">Login</button>
                    </div>
                </div>

            </fieldset>
        </form>
        <div class="new-user">
            <p>New to this site? <a href="#">Sign up now</a></p>
            <small>This page is only an example. <a href="#">Learn more</a></small>
        </div>
    </div>
</body>
</html>
