<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign-in Form project">
    <link rel="stylesheet" href="styles.css">
    <title>Login Form</title>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>

        <form action="/signin" method="post">
            <fieldset>

                <legend>Login</legend>

                <div class="login-card">
                    <div class="form-field form-email">
                        <input id="user-sign" name="user" type="text" required placeholder="Email or Phone number">
                        <label for="user-sign">Email or phone number</label>
                    </div>

                    <div class="form-field form-password">
                        <input type="password" name="user-password" id="password" required placeholder="Password">
                        <label for="password">Password</label>
                    </div>
                

                    <div class="form-help">
                        <div class="remember-me">
                            <input type="checkbox" id="checkbox" name="remember">  
                            <label for="checkbox">Remember me</label>    
                        </div>
                        <a href="#">Need help?</a>
                    </div>

                    <div class="button">
                        <button type="submit" id="btn-sign-in" name="sign-in" value="true" autofocus>Login</button>
                    </div>
                </div>

            </fieldset>
        </form>
        <div class="new-user">
            <p>New to this site? <a href="#">Sign up now</a></p>
            <small>This page is only an example. <a href="#">Learn more</a></small>
        </div>
    </div>
</body>
</html>
